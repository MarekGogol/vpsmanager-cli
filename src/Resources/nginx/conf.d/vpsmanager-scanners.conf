# Log format of the requests blocked by vpsmanager/scanners.conf: the combined format with the host
# of the request at the end. The address stays at the start of the line for fail2ban.
#
# Managed by VPS Manager (monitor:scanners), changes are overwritten.

log_format vpsmanager_scanners '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$host"';
