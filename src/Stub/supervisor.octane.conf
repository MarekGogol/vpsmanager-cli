; Laravel Octane server for {user} ({app}) by VPS Manager. Settings are in .env of the application (OCTANE_*).
[program:{program}]
command={php_bin} {path}/artisan octane:start
directory={path}
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={user}
redirect_stderr=true
stdout_logfile={path}/storage/logs/octane.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=60
startsecs=1
startretries=10
