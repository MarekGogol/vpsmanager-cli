# Bans are restored from the database when fail2ban starts. The database has to keep them at least as long
# as the history of the bans: the recidive jail raises the ban of an address banned again within 60 days (1, 7, 30 days).
#
# Managed by VPS Manager (monitor:install), changes are overwritten.

[DEFAULT]

dbpurgeage = 60d
