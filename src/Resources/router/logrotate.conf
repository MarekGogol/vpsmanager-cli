# Requests blocked by VPS Manager on the servers behind this router, rotated every day and deleted after a week.
#
# Managed by VPS Manager (monitor:install on a server behind this router), changes are overwritten.

{scanners_log} {auth_log} {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
