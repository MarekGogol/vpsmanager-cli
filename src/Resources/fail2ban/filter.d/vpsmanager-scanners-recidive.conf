# Bans of the vpsmanager-scanners jail in the log of fail2ban, for the long ban of repeating scanners.
#
# Managed by VPS Manager (nginx:scanners), changes are overwritten.

[Definition]

failregex = NOTICE\s+\[vpsmanager-scanners\]\s+Ban\s+<HOST>\s*$

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
