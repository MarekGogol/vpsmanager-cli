# Log format of the logs read by fail2ban: requests blocked by vpsmanager/scanners.conf and requests refused
# by auth_basic (vpsmanager/monitor.conf). The combined format with the host of the request at the end, the
# address stays at the start of the line for fail2ban.
#
# Managed by VPS Manager (monitor:install), changes are overwritten.

log_format vpsmanager_fail2ban '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$host"';

# Scanners of PHP2Shell (CVE-2026-109618, CVE-2026-109619) name the multipart boundary after it, rule in
# vpsmanager/scanners.conf. The page of the blocked request keeps the header, so it is not matched again.
# Volatile: the value of the request would be cached over the internal redirect to the page
map "$uri $content_type" $vpsmanager_php2shell {
    volatile;
    "~*^/vpsmanager-blocked\.html " 0;
    "~*boundary=-*php2shell" 1;
    default 0;
}
