# PHP files requested by scanners: web shells and installers (/worksec.php, /r5t.php, /simple.php...).
# Laravel applications serve every request through index.php, so any other .php file is blocked, except
# the assets of CrudAdmin (/vendor/crudadmin/..., e.g. the connector of CKFinder).
#
# Needs vpsmanager/scanners.conf in the same server section (418 and the block page), it is included
# right after it. Sections protected by a password (auth_basic of the server, e.g. phpMyAdmin or adminer
# in tools.*) and WordPress sections do not get this file, they serve their own PHP files.
#
# Managed by VPS Manager (monitor:install), changes are overwritten.

# index.php in any directory, also after try_files and index of a directory
if ($uri ~* "^(?!/vendor/crudadmin/|(?:.*/)?index\.php$).*\.php$") {
    return 418;
}
