# Requests of vulnerability scanners and bots, answered by NGINX without reaching PHP.
#
# Every rule matches only paths which no Laravel or plain PHP application of the server serves:
# WordPress paths, backups, editor leftovers, secrets and project files. They answer 403 with the
# static page scanners.html (English and Slovak, with a link to the homepage). Dot files (.env, .git)
# are denied by general.conf.
#
# Rules run in the rewrite phase of the server, before any location, so the position of the include
# in the host does not matter. Do not include this file in WordPress hosts (vpsmanager/wordpress.conf).

# 418 is only an internal marker of the rules, the visitor receives 403 with the page
error_page 418 =403 /vpsmanager-blocked.html;

location = /vpsmanager-blocked.html {
    internal;
    alias /etc/nginx/vpsmanager/scanners.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
}

# WordPress, also under a directory (/blog/wp-login.php, /wordpress/wp-admin)
if ($uri ~* "^/(?:[^/]+/)?(?:wp-admin|wp-includes|wp-content|wp-json)(?:/|$)") {
    return 418;
}

if ($uri ~* "/(?:wp-login|wp-signup|wp-cron|wp-trackback|wp-links-opml|wp-config|xmlrpc)\.php") {
    return 418;
}

if ($arg_rest_route) {
    return 418;
}

# Backups and leftovers of editors, in any directory
if ($uri ~* "(?:\.(?:sql|sql\.gz|sql\.zip|bak|old|orig|save|swp|swo|backup)|~)$") {
    return 418;
}

# Archives of the whole site in the root
if ($uri ~* "^/(?:backups?|site|www|public_html|web|html|webroot|htdocs|db|database|dump|data|wordpress|wp)\.(?:zip|tar|tar\.gz|tgz|gz|rar|7z)$") {
    return 418;
}

# Secrets and project files in the root
if ($uri ~* "^/(?:id_(?:rsa|dsa|ecdsa|ed25519)|credentials\.txt|pass(?:words?|wd)?\.txt|docker-compose\.ya?ml|config\.ya?ml|appsettings\.json|local\.settings\.json|settings\.py|web\.config|phpinfo\.php|composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|artisan)$") {
    return 418;
}

if ($uri ~* "^/(?:config|app)/(?:database|secrets|credentials|master)\.(?:ya?ml(?:\.enc)?|key)$") {
    return 418;
}

# Known exploits of other software
if ($uri ~* "^/(?:cgi-bin|vendor/phpunit|phpunit)/|/eval-stdin\.php$") {
    return 418;
}
