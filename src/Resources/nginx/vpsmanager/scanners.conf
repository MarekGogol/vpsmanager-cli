# Requests of vulnerability scanners and bots, answered by NGINX without reaching PHP.
#
# Every rule matches only paths which no Laravel or plain PHP application of the server serves:
# WordPress paths, dot files, backups, editor leftovers, secrets and project files. They answer 403
# with the static page scanners.html (English and Slovak, with a link to the homepage).
#
# Rules run in the rewrite phase of the server, before any location, so the position of the include
# in the host does not matter. Do not include this file in WordPress hosts (vpsmanager/wordpress.conf).
# Other .php files than index.php are blocked by scanners-php.conf, included after this file.

# 418 is only an internal marker of the rules, the visitor receives 403 with the page
error_page 418 =403 /vpsmanager-blocked.html;

# Every blocked request is logged with its host (format of conf.d/vpsmanager-scanners.conf), also in hosts
# with access_log off. fail2ban bans the addresses of the scanners from this log (jail vpsmanager-scanners)
location = /vpsmanager-blocked.html {
    internal;
    # Hosts protected by a password would answer 401 instead of the page, the page holds no secrets
    auth_basic off;
    access_log /var/log/nginx/vpsmanager-scanners.log vpsmanager_scanners;
    alias /etc/nginx/vpsmanager/scanners.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
}

# Dot files (.env, .git), except Let's Encrypt challenges. general.conf denies them too, for hosts
# without this file
if ($uri ~ "/\.(?!well-known/)") {
    return 418;
}

# WordPress, also under a directory (/blog/wp-login.php, /wordpress/wp-admin)
if ($uri ~* "^/(?:[^/]+/)?(?:wp-admin|wp-includes|wp-content|wp-json)(?:/|$)") {
    return 418;
}

if ($uri ~* "/(?:wp-login|wp-signup|wp-cron|wp-trackback|wp-links-opml|wp-config|xmlrpc)\.php") {
    return 418;
}

if ($arg_rest_route) {
    return 418;
}

# Backups and leftovers of editors, in any directory except the storage of uploaded files
# of the applications (/uploads/{table}/{field}/...), where they may be downloaded
if ($uri ~* "^(?!/uploads/[^/]+/[^/]+/).*(?:\.(?:sql|sql\.gz|sql\.zip|bak|old|orig|save|swp|swo|backup)|~)$") {
    return 418;
}

# Archives of the whole site in the root
if ($uri ~* "^/(?:backups?|site|www|public_html|web|html|webroot|htdocs|db|database|dump|data|wordpress|wp)\.(?:zip|tar|tar\.gz|tgz|gz|rar|7z)$") {
    return 418;
}

# Secrets and project files in the root
if ($uri ~* "^/(?:id_(?:rsa|dsa|ecdsa|ed25519)|credentials\.txt|pass(?:words?|wd)?\.txt|docker-compose\.ya?ml|config\.ya?ml|appsettings\.json|local\.settings\.json|settings\.py|web\.config|phpinfo\.php|composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|artisan)$") {
    return 418;
}

if ($uri ~* "^/(?:config|app)/(?:database|secrets|credentials|master)\.(?:ya?ml(?:\.enc)?|key)$") {
    return 418;
}

# Private keys, certificates, secrets and Docker files in the root (/server.key, /key.pem, /secrets.json)
if ($uri ~* "^/(?:[^/]+\.(?:key|pem)|secrets\.json|credentials\.json|Dockerfile)$") {
    return 418;
}

# Configuration of deployments and AI gateways in the root (serverless, AWS SAM, Terraform, LiteLLM)
if ($uri ~* "^/(?:serverless\.ya?ml|template\.ya?ml|samconfig\.(?:toml|ya?ml)|[^/]+\.(?:tf|tfvars|tfstate)(?:\.json)?|litellm(?:[_-]config)?\.ya?ml|litellm/config\.ya?ml)$") {
    return 418;
}

# Known exploits of other software (Atlassian REST API of Jira and Confluence, profiler of Symfony)
if ($uri ~* "^/(?:cgi-bin|vendor/phpunit|phpunit|_profiler)/|/eval-stdin\.php$|^/rest/api/[^/]+/application-properties") {
    return 418;
}
