# Access log of the monitor (vpsmanager/monitor.conf in the hosts), for the analysis of the requests of the last
# days: which addresses and urls should be banned too. Rotated and deleted after a week by VPS Manager.
#
# Managed by VPS Manager (monitor:access-log), changes are overwritten.

# Static files are not logged, they are most of the requests and tell nothing about attacks
map $uri $vpsmanager_monitor_loggable {
    ~*\.(?:css|js|mjs|map|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mp3)$ 0;
    default 1;
}

# Query strings with secrets (tokens, codes, passwords) are masked, the log keeps urls for a week
map $args $vpsmanager_monitor_args {
    "" "";
    ~*(?:^|&)[^=&]*(?:token|code|pass|secret|key|hash|signature|auth)[^=&]*= "?[masked]";
    default "?$args";
}

log_format vpsmanager_monitor '$remote_addr [$time_iso8601] "$host" "$request_method $uri$vpsmanager_monitor_args" '
                              '$status $body_bytes_sent $request_time "$http_referer" "$http_user_agent"';
