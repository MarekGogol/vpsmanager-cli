; Laravel queue workers for {user} ({app}) by VPS Manager.
[program:{program}]
process_name=%(program_name)s_%(process_num)02d
command={php_bin} {path}/artisan queue:work{queue} --sleep=3 --tries=3 --max-time=3600
directory={path}
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={user}
numprocs={workers}
redirect_stderr=true
stdout_logfile={path}/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
startsecs=1
startretries=10
