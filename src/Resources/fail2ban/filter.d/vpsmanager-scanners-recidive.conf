# Bans of the vpsmanager-scanners and vpsmanager-http-auth jails in the log of fail2ban, for the long ban
# of repeating scanners.
#
# Managed by VPS Manager (monitor:install), changes are overwritten.

[Definition]

failregex = NOTICE\s+\[vpsmanager-(?:scanners|http-auth)\]\s+Ban\s+<HOST>\s*$

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
