# Requests blocked by VPS Manager on the servers behind this router. NGINX of the servers sends them over syslog,
# fail2ban of this router bans the scanners for all servers (jails vpsmanager-scanners and vpsmanager-http-auth).
#
# Managed by VPS Manager (monitor:install on a server behind this router), changes are overwritten.

# Only the servers of the internal network may send, the router listens on its internal address only
$AllowedSender UDP, {network}

module(load="imudp")
input(type="imudp" address="{address}" port="{port}" ruleset="vpsmanager")

# The line of NGINX as it is (the address of the visitor first), followed by the address of the server
template(name="vpsmanager" type="string" string="%msg:2:$% \"%fromhost-ip%\"\n")

ruleset(name="vpsmanager") {
    if $programname == "vpsm_scanners" then {
        action(type="omfile" file="{scanners_log}" template="vpsmanager")
    } else if $programname == "vpsm_auth" then {
        action(type="omfile" file="{auth_log}" template="vpsmanager")
    }

    # Other logs of the network are not kept
    stop
}
