# Access log of the monitor, the format is in conf.d/vpsmanager-monitor.conf. It replaces "access_log off"
# of the host, which would cancel any other access log of the same server section.
#
# Managed by VPS Manager (monitor:install), changes are overwritten.

access_log /var/log/vpsmanager/access.log vpsmanager_monitor buffer=64k flush=5s if=$vpsmanager_monitor_loggable;

# Requests refused by auth_basic (wrong or missing password), fail2ban bans the addresses guessing passwords
# (jail vpsmanager-http-auth). The format of the log is in conf.d/vpsmanager-scanners.conf
access_log /var/log/nginx/vpsmanager-auth.log vpsmanager_scanners if=$vpsmanager_auth_failed;

# Servers behind a router send the refused requests also to fail2ban of the router (empty for other servers)
include vpsmanager/router-auth.conf;
