# Access log of the monitor (vpsmanager/monitor.conf in the hosts), for the analysis of the requests of the last
# days: which addresses and urls should be banned too. Rotated and deleted after a week by VPS Manager.
#
# Managed by VPS Manager (monitor:install), changes are overwritten.

# Static files are not logged, they are most of the requests and tell nothing about attacks
map $uri $vpsmanager_monitor_loggable {
    ~*\.(?:css|js|mjs|map|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mp3)$ 0;
    default 1;
}

# Url as requested by the client ($uri is rewritten, e.g. to /index.php by try_files). Query strings with
# secrets (tokens, codes, passwords) are masked, the log keeps urls for a week
map $request_uri $vpsmanager_monitor_url {
    "~*^(?<vpsmanager_path>[^?]*)\?(?:.*&)?[^=&]*(?:token|code|pass|secret|key|hash|signature|auth)[^=&]*=" "${vpsmanager_path}?[masked]";
    default $request_uri;
}

log_format vpsmanager_monitor '$remote_addr [$time_iso8601] "$host" "$request_method $vpsmanager_monitor_url" '
                              '$status $body_bytes_sent $request_time "$http_referer" "$http_user_agent"';
