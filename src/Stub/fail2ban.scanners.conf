# Bans IP addresses of vulnerability scanners for all websites of the server. The scanners are found
# by vpsmanager/scanners.conf of NGINX, which writes every blocked request into the log.
#
# Managed by VPS Manager (monitor:install), changes are overwritten. Own IP addresses which must never
# be banned belong into /etc/fail2ban/jail.d/vpsmanager-scanners.local:
#
# [vpsmanager-scanners]
# ignoreip = %(known/ignoreip)s 203.0.113.10
#
# [vpsmanager-http-auth]
# ignoreip = %(known/ignoreip)s 203.0.113.10
#
# [vpsmanager-scanners-recidive]
# ignoreip = %(known/ignoreip)s 203.0.113.10
#
# [vpsmanager-shared-1d]
# ignoreip = %(known/ignoreip)s 203.0.113.10

# A few blocked requests in a short time, banned for an hour
[vpsmanager-scanners]
enabled  = true
backend  = auto
filter   = vpsmanager-scanners
logpath  = {log_path}
port     = http,https
maxretry = 5
findtime = 10m
bantime  = 1h
ignoreip = {ignoreip}

# Addresses guessing passwords of hosts protected by auth_basic, many refused requests in a short time.
# A browser is refused once before it asks for the password, so 30 refusals are never a person
[vpsmanager-http-auth]
enabled  = true
backend  = auto
filter   = vpsmanager-http-auth
logpath  = {auth_log_path}
port     = http,https
maxretry = 30
findtime = 10m
bantime  = 1h
ignoreip = {ignoreip}

# Addresses banned by the other servers, shared by the monitor: monitor:sync bans them every 3 hours in the jail of their
# level (1, 7 or 30 days) and unbans those the monitor stops sharing. Nothing writes into their log, a ban expires by itself
# after the days of its level also when the monitor stops answering
[vpsmanager-shared-1d]
enabled  = true
backend  = auto
filter   = vpsmanager-scanners
logpath  = {shared_log_path}
port     = http,https
maxretry = 1
bantime  = 1d
ignoreip = {ignoreip}

[vpsmanager-shared-7d]
enabled  = true
backend  = auto
filter   = vpsmanager-scanners
logpath  = {shared_log_path}
port     = http,https
maxretry = 1
bantime  = 7d
ignoreip = {ignoreip}

[vpsmanager-shared-30d]
enabled  = true
backend  = auto
filter   = vpsmanager-scanners
logpath  = {shared_log_path}
port     = http,https
maxretry = 1
bantime  = 30d
ignoreip = {ignoreip}

# Scanners banned again and again (also by vpsmanager-http-auth): the first ban lasts a day, the next one 7 days, then 30 days.
# fail2ban counts the previous bans of an address in its database (dbpurgeage, 60 days). Only the web ports, a shared address keeps SSH
[vpsmanager-scanners-recidive]
# iptables chains are named f2b-<name> and may have 28 characters at most, the name of this jail is too long
action   = %(banaction)s[name=vpsm-recidive, port="%(port)s", protocol="%(protocol)s", chain="%(chain)s"]
enabled  = true
backend  = auto
filter   = vpsmanager-scanners-recidive
logpath  = /var/log/fail2ban.log
port     = http,https
maxretry = 3
findtime = 1d
bantime  = 1d
bantime.increment   = true
bantime.multipliers = 1 7 30
ignoreip = {ignoreip}
