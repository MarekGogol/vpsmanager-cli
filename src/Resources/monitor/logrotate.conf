# Rotation of the access log of the monitor, run every hour by /etc/cron.hourly/vpsmanager-monitor with its
# own state file. The log is rotated every day and also whenever it grows over {max_size}, rotated logs
# are compressed and deleted after a week, so the log never fills the disk.
#
# Managed by VPS Manager (monitor:install), changes are overwritten.

/var/log/vpsmanager/access.log {
    daily
    maxsize {max_size}
    rotate 7
    maxage 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        [ ! -f /run/nginx.pid ] || kill -USR1 "$(cat /run/nginx.pid)"
    endscript
}
